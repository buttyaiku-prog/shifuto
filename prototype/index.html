<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>すみれの丘 シフト管理</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: soft clinical workbench — header band with role switch, one page per tab, shift grid beside a slot panel */
:root {
  --bg: #e8eef1; --surface: #eff4f6; --raised: #f5f8fa; --sh-hi: #ffffff; --sh-lo: #c6d2d9;
  --fg: #1c2a32; --muted: #5d6f79; --line: #d5dfe4;
  --accent: #157b7a; --accent-2: #1c9592; --accent-fg: #ffffff; --accent-soft: #d5ecea; --col-on: #fdf3e2;
  --d-bg: #dbe8fb; --d-fg: #1d5aa6; --d-line: #b6cdf1;
  --l-bg: #d7f0e4; --l-fg: #17704a; --l-line: #a9dcc3;
  --n-bg: #e9e0f8; --n-fg: #6338ab; --n-line: #cdbcef;
  --e-bg: #d6f0f6; --e-fg: #0e6a80; --e-line: #a6d9e6;
  --x-bg: #fbe1ec; --x-fg: #a3325f; --x-line: #f0b6cd;
  --o-bg: #e1e7ea; --o-fg: #56656e; --o-line: #ccd6dc;
  --warn: #b8610d; --warn-bg: #fcefdc; --warn-line: #f0c58e;
  --danger: #bf3434; --danger-bg: #fbe2e2; --ok: #1d7a4b; --ok-bg: #dcf1e5;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151d22; --surface: #1b252b; --raised: #212d34; --sh-hi: #24313a; --sh-lo: #0b1013;
    --fg: #e2eaee; --muted: #98aab4; --line: #2b3942;
    --accent: #3cb3ae; --accent-2: #2a9a96; --accent-fg: #071a1a; --accent-soft: #1b3a3a; --col-on: #2f2618;
    --d-bg: #1e3250; --d-fg: #a0c5f6; --d-line: #2e4a73;
    --l-bg: #183a2b; --l-fg: #88d6b0; --l-line: #24543f;
    --n-bg: #2e2445; --n-fg: #c7aaf5; --n-line: #45366a;
    --e-bg: #173640; --e-fg: #8fd6e8; --e-line: #255563;
    --x-bg: #3e2030; --x-fg: #f2a2c4; --x-line: #63304a;
    --o-bg: #26313a; --o-fg: #a4b2bb; --o-line: #34424c;
    --warn: #f0a650; --warn-bg: #392914; --warn-line: #6a4a1f;
    --danger: #f27b7b; --danger-bg: #3c1f22; --ok: #6fd3a0; --ok-bg: #173527;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151d22; --surface: #1b252b; --raised: #212d34; --sh-hi: #24313a; --sh-lo: #0b1013;
  --fg: #e2eaee; --muted: #98aab4; --line: #2b3942;
  --accent: #3cb3ae; --accent-2: #2a9a96; --accent-fg: #071a1a; --accent-soft: #1b3a3a; --col-on: #2f2618;
  --d-bg: #1e3250; --d-fg: #a0c5f6; --d-line: #2e4a73;
  --l-bg: #183a2b; --l-fg: #88d6b0; --l-line: #24543f;
  --n-bg: #2e2445; --n-fg: #c7aaf5; --n-line: #45366a;
  --e-bg: #173640; --e-fg: #8fd6e8; --e-line: #255563;
  --x-bg: #3e2030; --x-fg: #f2a2c4; --x-line: #63304a;
  --o-bg: #26313a; --o-fg: #a4b2bb; --o-line: #34424c;
  --warn: #f0a650; --warn-bg: #392914; --warn-line: #6a4a1f;
  --danger: #f27b7b; --danger-bg: #3c1f22; --ok: #6fd3a0; --ok-bg: #173527;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.tn { font-variant-numeric: tabular-nums; }
.neu { background: var(--surface); border-radius: 20px; box-shadow: 7px 7px 18px var(--sh-lo), -7px -7px 18px var(--sh-hi); }

/* top bar */
.topbar { background: var(--surface); box-shadow: 0 4px 14px var(--sh-lo); }
.topbar-in { display: flex; align-items: center; gap: 12px 24px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; letter-spacing: .02em; }
.brand svg { width: 30px; height: 30px; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav a { text-decoration: none; padding: 9px 18px; border-radius: 12px; font-weight: 500; color: var(--muted); position: relative; }
.nav a[aria-current="page"] { color: var(--accent); background: var(--surface); box-shadow: inset 3px 3px 7px var(--sh-lo), inset -3px -3px 7px var(--sh-hi); font-weight: 700; }
.nav .cnt { position: absolute; top: 2px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: var(--accent-fg); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.who { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: var(--muted); font-weight: 500; }
.who label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.who select { font: inherit; font-weight: 700; color: var(--fg); background: var(--surface); border: 0; padding: 7px 10px; border-radius: 10px; box-shadow: inset 2px 2px 5px var(--sh-lo), inset -2px -2px 5px var(--sh-hi); }
.facility { display: flex; gap: 6px; align-items: center; }
.facility svg { width: 18px; height: 18px; color: var(--accent); }

/* page */
main.wrap { padding-block: 22px 28px; }
.titlebar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.titlebar h1 { margin: 0; font-size: 30px; letter-spacing: .04em; display: inline; }
.titlebar .sub { margin: 0 0 0 14px; display: inline; color: var(--muted); font-size: 16px; }
.proto { display: inline-block; margin-left: 10px; font-size: 11.5px; padding: 2px 8px; border-radius: 99px; border: 1px dashed var(--muted); color: var(--muted); vertical-align: 2px; letter-spacing: .04em; }
.state-tag { font-weight: 700; color: var(--fg); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; background: var(--surface); padding: 11px 20px; border-radius: 14px; font-weight: 700; box-shadow: 5px 5px 12px var(--sh-lo), -5px -5px 12px var(--sh-hi); text-decoration: none; }
.btn:active { box-shadow: inset 3px 3px 7px var(--sh-lo), inset -3px -3px 7px var(--sh-hi); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: var(--accent-fg); }
.btn:disabled { opacity: .5; box-shadow: none; }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.ghost { box-shadow: none; border-color: var(--line); background: transparent; }
.btn.danger { box-shadow: none; border-color: var(--danger); color: var(--danger); background: transparent; }
.link { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: 14px; background: var(--accent-soft); color: var(--fg); margin-bottom: 18px; font-size: 13.5px; }
.banner.w { background: var(--warn-bg); }
.banner b { color: var(--accent); }
.banner.w b { color: var(--warn); }

/* shift layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 22px; align-items: start; }
@media (max-width: 1150px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.board { padding: 18px; min-width: 0; }
.toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 4px; border-radius: 14px; background: var(--surface); box-shadow: inset 3px 3px 7px var(--sh-lo), inset -3px -3px 7px var(--sh-hi); }
.seg button { border: 0; background: transparent; padding: 8px 16px; border-radius: 11px; font-weight: 500; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button svg { width: 16px; height: 16px; }
.seg button[aria-pressed="true"] { background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: var(--accent-fg); font-weight: 700; }
.mnav { display: flex; align-items: center; gap: 14px; margin-inline: auto; }
.mnav strong { font-size: 18px; min-width: 7em; text-align: center; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--surface); box-shadow: 4px 4px 10px var(--sh-lo), -4px -4px 10px var(--sh-hi); display: grid; place-items: center; }
.iconbtn:disabled { opacity: .4; box-shadow: none; }
.iconbtn svg { width: 18px; height: 18px; }
.range { color: var(--muted); font-size: 15px; }

/* grid */
.grid-wrap { overflow-x: auto; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
.grid th, .grid td { border-bottom: 1px solid var(--line); padding: 0; }
.grid thead th, .grid thead td { background: var(--raised); }
.grid .dh { border-left: 1px solid var(--line); text-align: center; font-weight: 700; padding: 8px 4px 6px; font-size: 13.5px; line-height: 1.3; min-width: 104px; position: relative; }
.grid .dh span { font-weight: 500; }
.grid .dh.sun { color: var(--danger); }
.grid .dh.sat { color: var(--d-fg); }
.grid .dh .calmark { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.grid .on { background: var(--col-on) !important; }
.grid .nm-h { position: sticky; left: 0; z-index: 3; text-align: left; padding: 8px 12px; font-size: 13px; min-width: 170px; background: var(--raised); }
.grid .nm-h.sub { font-weight: 500; color: var(--muted); font-size: 12px; }
.grid td { border-left: 1px solid var(--line); text-align: center; }
.cov { padding: 5px 4px !important; }
.cov-in { display: flex; flex-direction: column; gap: 3px; }
.cov-b { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 1px 4px; font-size: 11.5px; display: flex; justify-content: space-between; gap: 4px; }
.cov-b b { font-weight: 700; }
.cov-b.short { border-color: var(--warn-line); background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.cov-b.cur { outline: 2px solid var(--accent); outline-offset: 0; }
.cov-b.none { opacity: .45; }
.grid tbody th.nm { position: sticky; left: 0; z-index: 2; background: var(--raised); text-align: left; padding: 6px 10px 6px 12px; font-weight: 400; }
.grid tbody tr.me th.nm, .grid tbody tr.me td { background: var(--accent-soft); }
.nm-in { display: flex; gap: 9px; align-items: flex-start; }
.nm-in b { display: block; font-size: 14.5px; white-space: nowrap; }
.nm-in small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; flex: none; }
.dot.rn { background: var(--accent); }
.dot.cw { background: var(--warn); }
.cell { width: 100%; height: 48px; border: 0; background: transparent; display: grid; place-items: center; position: relative; border-radius: 0; padding: 0 3px; }
button.cell:hover { background: var(--accent-soft); }
div.cell { cursor: default; }
.cell.hl { box-shadow: inset 0 0 0 2px var(--warn); background: var(--warn-bg); }
.cell.bad { box-shadow: inset 0 0 0 2px var(--danger); background: var(--danger-bg); }
.cell.bad::after { content: "!"; position: absolute; left: 4px; top: 2px; font-size: 11px; font-weight: 700; color: var(--danger); }
.cell .lock { position: absolute; right: 3px; top: 3px; width: 12px; height: 12px; color: var(--muted); }
.chip { display: inline-block; padding: 4px 9px; border-radius: 8px; font-size: 12.5px; font-weight: 700; border: 1px solid; white-space: nowrap; }
.chip.d { background: var(--d-bg); color: var(--d-fg); border-color: var(--d-line); }
.chip.l { background: var(--l-bg); color: var(--l-fg); border-color: var(--l-line); }
.chip.n { background: var(--n-bg); color: var(--n-fg); border-color: var(--n-line); }
.chip.e { background: var(--e-bg); color: var(--e-fg); border-color: var(--e-line); }
.chip.x { background: var(--x-bg); color: var(--x-fg); border-color: var(--x-line); }
.chip.off { background: var(--o-bg); color: var(--o-fg); border-color: var(--o-line); font-weight: 500; }
.chip.req { background: transparent; color: var(--danger); border: 1px dashed var(--danger); font-weight: 500; }
.ake { font-size: 12px; color: var(--n-fg); }
.none { color: var(--muted); }
table.grid.compact .dh { min-width: 40px; font-size: 12px; padding: 6px 2px; }
table.grid.compact .cell { height: 36px; }
table.grid.compact .chip { padding: 2px 5px; font-size: 12px; border-radius: 6px; }
table.grid.compact .cov-b { justify-content: center; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend .lock-i { width: 13px; height: 13px; }
.sev-badge { margin-left: auto; padding: 6px 12px; border-radius: 12px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.sev-badge.ok { color: var(--ok); background: var(--surface); box-shadow: 3px 3px 8px var(--sh-lo), -3px -3px 8px var(--sh-hi); }
.sev-badge.ng { color: var(--danger); background: var(--danger-bg); }

/* side */
.side { padding: 20px; min-width: 0; }
.side-h { display: flex; align-items: center; gap: 10px; }
.side h2 { margin: 0; font-size: 22px; }
.side h2 em { font-style: normal; color: var(--warn); margin-left: 6px; }
.ic-warn { width: 24px; height: 24px; border-radius: 50%; background: var(--warn); color: var(--accent-fg); font-weight: 700; display: grid; place-items: center; font-size: 14px; flex: none; }
.ic-warn.ok { background: var(--ok); }
.short-list { list-style: none; margin: 14px 0 6px; padding: 0; display: grid; gap: 10px; }
.short { width: 100%; text-align: left; border: 1px solid transparent; background: var(--surface); border-radius: 14px; padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: 4px 4px 10px var(--sh-lo), -4px -4px 10px var(--sh-hi); }
.short b { display: block; font-size: 15px; }
.short small { color: var(--warn); font-weight: 700; font-size: 13px; }
.short.on { border-color: var(--warn-line); background: var(--warn-bg); }
.chev { font-size: 22px; color: var(--muted); line-height: 1; }
.detail { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
.detail h3 { margin: 0 0 8px; font-size: 19px; }
.pill { display: inline-block; padding: 4px 12px; border-radius: 99px; font-weight: 700; font-size: 13.5px; }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.cal-note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.detail h4 { margin: 18px 0 8px; font-size: 15px; }
.detail h4 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.cands { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cand { width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: 13px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; box-shadow: 4px 4px 10px var(--sh-lo), -4px -4px 10px var(--sh-hi); }
button.cand:hover { outline: 1px solid var(--accent); }
.cand b { font-size: 14.5px; }
.cand small { display: block; color: var(--muted); font-size: 12px; }
.cand .st { font-size: 12.5px; color: var(--accent); font-weight: 700; }
.cand .st.w { color: var(--warn); }
.cand .go { font-size: 12px; color: var(--accent); font-weight: 700; white-space: nowrap; }
.cand.no { box-shadow: none; border: 1px dashed var(--line); cursor: default; }
.cand.no .st { color: var(--danger); }
details.more { margin-top: 10px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.more .cands { margin-top: 8px; }
.placed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.placed li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 9px 12px; border-radius: 13px; border: 1px solid var(--line); background: var(--raised); }
.placed .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
.placed .pn { font-weight: 700; }
.placed .pr { color: var(--muted); font-size: 12px; }
.placed .acts { margin-left: auto; display: flex; gap: 6px; }
.hint { color: var(--muted); font-size: 13px; }

/* step bar */
.stepbar { background: var(--surface); box-shadow: 0 -4px 14px var(--sh-lo); padding-bottom: env(safe-area-inset-bottom, 0px); margin-top: 24px; }
@media (min-width: 900px) { .stepbar { position: sticky; bottom: 0; z-index: 20; } }
.stepbar-in { display: flex; align-items: center; gap: 18px; padding-block: 12px; flex-wrap: wrap; }
.steps { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.steps .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--o-bg); color: var(--o-fg); flex: none; }
.steps li.cur .num { background: var(--accent); color: var(--accent-fg); box-shadow: 0 0 0 5px var(--accent-soft); }
.steps li.done .num { background: var(--accent-soft); color: var(--accent); }
.steps li.cur, .steps li.done { color: var(--fg); }
.steps b { display: block; font-size: 15px; }
.steps small { display: block; font-size: 12px; color: var(--muted); max-width: 18em; }
.steps .arr { color: var(--line); font-size: 18px; }
.foot-act { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.foot-act .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.foot-note { font-size: 12px; color: var(--muted); }
.foot-note.w { color: var(--warn); }
.foot-note.ng { color: var(--danger); }
@media (max-width: 700px) { .steps small { display: none; } .foot-act { margin-left: 0; align-items: stretch; width: 100%; } .foot-act .btn { flex: 1; justify-content: center; } }

/* other pages */
.cols { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.card { padding: 20px; min-width: 0; }
.card + .card { margin-top: 22px; }
.cols > .card { margin-top: 0; }
.card h2 { margin: 0 0 4px; font-size: 19px; }
.card h2 small { font-size: 12.5px; font-weight: 400; color: var(--muted); margin-left: 8px; }
.card > p.lead { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.f { display: grid; gap: 5px; min-width: 0; }
.f > span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.f input[type=text], .f input[type=email], .f input[type=number], .f input[type=date], .f input[type=time], .f select, .f textarea, .inl {
  font: inherit; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0; }
.inl { width: 72px; padding: 5px 8px; text-align: right; }
.f textarea { resize: vertical; }
.f .err { color: var(--danger); font-size: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.form-row > .f { flex: 1 1 140px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.radios { display: flex; gap: 8px; flex-wrap: wrap; }
.radios label { display: flex; gap: 6px; align-items: center; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; }

<script>
(() => {
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- 定数 ---------- */
const DAYS = 30;                               // 2026年11月。11/1は日曜
const DOW = ['日', '月', '火', '水', '木', '金', '土'];
const dowOf = d => (d - 1) % 7;
const fmtD = d => `11/${d}(${DOW[dowOf(d)]})`;
const WEEKS = [[1, 7], [8, 14], [15, 21], [22, 28], [29, 30]];
const weekIdx = d => Math.floor((d - 1) / 7);
const weekLabel = w => `11/${WEEKS[w][0]}〜11/${WEEKS[w][1]}の週`;
const JOBS = ['看護師', '介護士'];
const COLORS = { d: '青', l: '緑', n: '紫', e: '水色', x: '桃' };
const ROLE_NAMES = { admin: 'システム管理者', maker: 'シフト作成者', staff: '一般職員' };
const REQ_TYPES = { off: '希望休', wish: '勤務希望', avail: '勤務可能時間' };
const ST_NAMES = { pending: '申請中', approved: '承認済み', rejected: '却下', withdrawn: '取下げ' };
const STORE = 'sumire-shift-2026-11-v2';
const range = ([a, b]) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const hm = m => `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}`;
const hrs = m => `${(m / 60).toFixed(m % 60 ? 1 : 0)}h`;
const toHM = m => { const x = ((m % 1440) + 1440) % 1440; return `${String(Math.floor(x / 60)).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}`; };
const parseHM = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
const nowStr = () => { const t = new Date(); return `${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`; };

/* ---------- サンプルデータ ---------- */
function seedDb() {
  const S = (id, name, job, emp, o) => ({ id, name, job, emp, contract: emp === '正職員' ? 'month' : 'week', monthMin: 9600, weekMin: 1800, nMin: 0, nWish: 0, nMax: 0, offCap: emp === '正職員' ? 8 : 6, email: `staff${id.slice(1).padStart(2, '0')}@sumire-clinic.example`, active: true, ...o });
  const staff = [
    S('s1', '田中 美咲', '看護師', '正職員', { nMin: 4, nWish: 5, nMax: 6 }),
    S('s2', '佐藤 直樹', '看護師', '正職員', { nMin: 4, nWish: 5, nMax: 6 }),
    S('s3', '鈴木 さくら', '看護師', 'パート'),
    S('s4', '高橋 翔太', '看護師', '正職員', { nMin: 4, nWish: 6, nMax: 7 }),
    S('s5', '小林 由美', '看護師', '正職員', { nMin: 3, nWish: 4, nMax: 5 }),
    S('s6', '加藤 恵', '看護師', 'パート', { nWish: 1, nMax: 2 }),
    S('s7', '井上 真由', '看護師', '正職員', { nMin: 4, nWish: 5, nMax: 6 }),
    S('s8', '伊藤 葵', '介護士', '正職員', { nMin: 4, nWish: 5, nMax: 7 }),
    S('s9', '渡辺 大輔', '介護士', '正職員', { nMin: 4, nWish: 6, nMax: 7 }),
    S('s10', '中村 玲奈', '介護士', 'パート'),

    S('s12', '吉田 誠', '介護士', '正職員', { nMin: 4, nWish: 5, nMax: 7 }),
    S('s13', '松本 彩', '介護士', '正職員', { nMin: 4, nWish: 5, nMax: 7 }),
  ];
  const OFF = { s1: [14, 15], s2: [3], s3: [11, 24], s4: [7, 21], s5: [1, 2], s6: [18], s7: [26], s8: [9, 16], s9: [22], s10: [13, 27], s11: [5, 6], s12: [29], s13: [8, 25] };
  let n = 1; const requests = [];
  Object.entries(OFF).forEach(([sid, ds]) => ds.forEach(d => requests.push({ id: 'r' + n++, sid, d, type: 'off', comment: '', status: 'approved', at: '10/12 09:10', by: 'システム管理者', note: '' })));
  requests.push({ id: 'r' + n++, sid: 's1', d: 20, type: 'off', comment: '子どもの学校行事のため', status: 'pending', at: '10/24 21:05' });
  requests.push({ id: 'r' + n++, sid: 's9', d: 27, type: 'off', comment: '通院', status: 'pending', at: '10/25 18:40' });
  requests.push({ id: 'r' + n++, sid: 's3', d: 4, type: 'avail', from: '09:00', to: '16:00', comment: '保育園の送迎', status: 'approved', at: '10/10 12:00' });
  requests.push({ id: 'r' + n++, sid: 's6', d: 12, type: 'wish', k: 'D', comment: '', status: 'approved', at: '10/11 08:30' });
  requests.push({ id: 'r' + n++, sid: 's12', d: 30, type: 'off', comment: '', status: 'rejected', at: '10/15 10:00', by: 'システム管理者', note: '月末は夜勤者が不足するため' });
  return {
    patterns: [
      { key: 'D', name: '日勤', short: '日', start: 510, end: 1050, brk: 60, color: 'd' },
      { key: 'L', name: '遅番', short: '遅', start: 660, end: 1200, brk: 60, color: 'l' },
      { key: 'N', name: '夜勤', short: '夜', start: 990, end: 2010, brk: 120, color: 'n' },
    ],
    staff,
    pairs: [{ id: 'p1', a: 's4', b: 's9', type: '禁止', note: '業務上の申し送りトラブル' }, { id: 'p2', a: 's8', b: 's10', type: '回避', note: '新人同士' }],
    base: {
      weekday: { D: { 看護師: 2, 介護士: 1 }, L: { 看護師: 1, 介護士: 1 }, N: { 看護師: 1, 介護士: 1 } },
      rest: { D: { 看護師: 1, 介護士: 1 }, L: { 看護師: 0, 介護士: 0 }, N: { 看護師: 1, 介護士: 1 } },
    },
    exceptions: [
      { id: 'x1', d: 10, k: 'N', job: '看護師', count: 2, note: '重症の方の受け入れ' },
      { id: 'x2', d: 12, k: 'L', job: '介護士', count: 2, note: '入浴介助の増便' },
      { id: 'x3', d: 20, k: 'D', job: '看護師', count: 3, note: '健診日' },
    ],
    calendar: [{ id: 'c1', d: 3, kind: '祝日', name: '文化の日' }, { id: 'c2', d: 23, kind: '祝日', name: '勤労感謝の日' }],
    deadline: '2026-10-31', gapMin: 660, runMax: 5,
    requests, changes: [],
    asg: {}, lock: { 's2|10': true }, seed: 7, status: 'draft', version: 0, published: 0, pubAsg: null,
    reasons: {}, notify: { mail: true, line: false, app: true }, history: [], nextId: 200,

}

let db, ui = { route: 'shift', role: 'admin', me: 's1', view: 'week', week: 1, sel: null, showAll: false, reqTab: 'wish', reqStaff: 's1', reqType: 'off', picked: [], reqFilter: 'all', issues: [] };
const nid = p => p + (db.nextId++);
const PAT = () => db.patterns;
const pk = k => db.patterns.find(p => p.key === k);
const isWork = v => !!v && v !== 'O' && !!pk(v);
const wm = k => { const p = pk(k); return p.end - p.start - p.brk; };
const crosses = k => pk(k).end > 1440;
const gapBetween = (a, b) => 1440 + pk(b).start - pk(a).end;   // a の翌日に b
const SID = id => db.staff.find(s => s.id === id);
const active = () => db.staff.filter(s => s.active);
const target = s => s.contract === 'week' ? Math.round(s.weekMin * DAYS / 7) : s.monthMin;
const calOf = d => db.calendar.find(c => c.d === d);
const isRest = d => { const c = calOf(d); if (c && c.kind === '特別営業日') return false; if (c) return true; return dowOf(d) === 0 || dowOf(d) === 6; };
const isRedDay = d => dowOf(d) === 0 || (calOf(d) && calOf(d).kind !== '特別営業日');
const req = (d, k, j) => { const e = db.exceptions.find(x => x.d === d && x.k === k && x.job === j); if (e) return e.count; const b = db.base[isRest(d) ? 'rest' : 'weekday'][k]; return b ? (b[j] || 0) : 0; };
const exNote = d => db.exceptions.filter(x => x.d === d).map(x => `${pk(x.k) ? pk(x.k).name : ''}・${x.job}を${x.count}名に（${x.note || '日付例外'}）`).join('、');

const availOf = (sid, d) => db.requests.find(r => r.sid === sid && r.d === d && r.type === 'avail' && r.status === 'approved');
const wishOf = (sid, d) => db.requests.find(r => r.sid === sid && r.d === d && r.type === 'wish' && r.status === 'approved');
const fits = (k, av) => { let f = parseHM(av.from), t = parseHM(av.to); if (t <= f) t += 1440; const p = pk(k); return p.start >= f && p.end <= t; };
const order = () => [...PAT()].sort((a, b) => (b.end > 1440) - (a.end > 1440) || a.start - b.start).map(p => p.key);
const can = what => ({ edit: ui.role !== 'staff', decide: ui.role === 'admin', master: ui.role === 'admin' })[what];
function log(text) { db.history.unshift({ at: nowStr(), who: ui.role === 'staff' ? `一般職員（${SID(ui.me).name}）` : ROLE_NAMES[ui.role], text }); db.history.length = Math.min(db.history.length, 200); }
function ensureAsg() { db.staff.forEach(s => { if (!db.asg[s.id]) db.asg[s.id] = Array(DAYS + 2).fill(''); }); }
function blankAsg() { const o = {}; db.staff.forEach(s => { o[s.id] = Array(DAYS + 2).fill(''); }); return o; }

/* ---------- 計算 ---------- */
let OFFM = {};
function refreshOff() { OFFM = {}; db.staff.forEach(s => { OFFM[s.id] = offSet(s.id); }); }
function staffStats(a) {
  let min = 0, n = 0; const wk = [0, 0, 0, 0, 0];
  for (let d = 1; d <= DAYS; d++) { const v = a[d]; if (isWork(v)) { min += wm(v); wk[weekIdx(d)] += wm(v); if (crosses(v)) n++; } }
  return { min, n, wk };
}
function runLen(a, d) { let c = 1; for (let i = d - 1; i >= 1 && isWork(a[i]); i--) c++; for (let i = d + 1; i <= DAYS && isWork(a[i]); i++) c++; return c; }
const countOn = (asg, d, k, j) => active().filter(s => s.job === j && asg[s.id][d] === k).length;
const partners = (asg, s, d, k, type) => db.pairs.filter(p => p.type === type && (p.a === s.id || p.b === s.id)).map(p => p.a === s.id ? p.b : p.a).filter(o => SID(o) && SID(o).active && asg[o] && asg[o][d] === k);

function blockReason(asg, s, d, k, forGen) {
  const a = asg[s.id], prev = a[d - 1], next = a[d + 1];
  if (OFFM[s.id] && OFFM[s.id].has(d)) return '希望休（承認済み）';
  if (d > 1 && isWork(prev) && gapBetween(prev, k) < 0) return '前日の勤務と時間が重なる';
  if (isWork(next) && gapBetween(k, next) < 0) return '翌日の勤務と時間が重なる';
  if (partners(asg, s, d, k, '禁止').length) return '相性「禁止」の職員が同じ勤務';
  if (forGen) {
    const av = availOf(s.id, d); if (av && !fits(k, av)) return '勤務可能時間外';
    if (d > 1 && isWork(prev) && (crosses(prev) || gapBetween(prev, k) < db.gapMin)) return '間隔';
    if (isWork(next) && (crosses(k) || gapBetween(k, next) < db.gapMin)) return '間隔';
    const st = staffStats(a);
    if (crosses(k) && st.n >= s.nMax) return '夜勤上限';
    if (s.contract === 'week') { if (st.wk[weekIdx(d)] + wm(k) > s.weekMin) return '週契約'; }
    else if (st.min + wm(k) > s.monthMin) return '月間時間';
    const t = a[d]; a[d] = k; const rl = runLen(a, d); a[d] = t;
    if (rl > db.runMax) return '連続勤務';
  }
  return '';
}

function generate(seed) {
  refreshOff();
  const rng = mulberry32(seed * 9973 + 17);
  const asg = blankAsg();
  db.staff.forEach(s => { for (let d = 1; d <= DAYS; d++) if (db.lock[s.id + '|' + d]) asg[s.id][d] = db.asg[s.id] ? db.asg[s.id][d] : ''; });
  const staff = active();
  for (let d = 1; d <= DAYS; d++) for (const k of order()) for (const j of JOBS) {
    let need = req(d, k, j) - countOn(asg, d, k, j);
    while (need > 0) {
      const c = staff.filter(s => s.job === j && asg[s.id][d] === '' && !db.lock[s.id + '|' + d] && !blockReason(asg, s, d, k, true));
      if (!c.length) break;
      const scored = c.map(s => {
        const st = staffStats(asg[s.id]);
        let v = st.min / target(s);
        if (crosses(k)) v += st.n < s.nMin ? -0.35 : (st.n >= s.nWish ? 0.25 : 0);
        const w = wishOf(s.id, d); if (w) v += w.k === k ? -0.5 : 0.3;
        if (partners(asg, s, d, k, '回避').length) v += 0.6;
        if (s.contract === 'week') v += 0.05;
        return [v + rng() * 0.12, s];
      }).sort((x, y) => x[0] - y[0]);
      asg[scored[0][1].id][d] = k; need--;
    }
  }
  staff.forEach(s => { if (s.contract === 'week') return; const a = asg[s.id]; for (let d = 1; d <= DAYS; d++) if (a[d] === '' && !db.lock[s.id + '|' + d] && !(d > 1 && isWork(a[d - 1]) && crosses(a[d - 1]))) a[d] = 'O'; });
  return asg;
}

function validate(asg) {
  refreshOff();
  const out = [];
  for (let d = 1; d <= DAYS; d++) for (const k of order()) for (const j of JOBS) {
    const need = req(d, k, j); if (!need) continue;
    const have = countOn(asg, d, k, j);
    if (have < need) out.push({ key: `short|${d}|${k}|${j}`, sev: 'reason', cat: '配置不足', d, k, j, need, have, text: `${fmtD(d)} ${pk(k).name}・${j}　必要${need}名 / 配置${have}名` });
  }
  for (const s of active()) {
    const a = asg[s.id], st = staffStats(a);
    for (let d = 1; d <= DAYS; d++) {
      const v = a[d]; if (!isWork(v)) continue;
      if (OFFM[s.id].has(d)) out.push({ key: `off|${s.id}|${d}`, sev: 'severe', cat: '承認済み希望休に勤務', sid: s.id, d, text: `${s.name}　${fmtD(d)} は承認済みの希望休ですが${pk(v).name}が入っています` });
      const av = availOf(s.id, d);
      if (av && !fits(v, av)) out.push({ key: `av|${s.id}|${d}`, sev: 'reason', cat: '勤務可能時間外', sid: s.id, d, text: `${s.name}　${fmtD(d)} ${pk(v).name}は勤務可能時間（${av.from}〜${av.to}）の外です` });
      const p = a[d - 1];
      if (d > 1 && isWork(p)) {
        const gap = gapBetween(p, v);
        if (gap < 0) out.push({ key: `ovl|${s.id}|${d}`, sev: 'severe', cat: '勤務時間の重複', sid: s.id, d, text: `${s.name}　${fmtD(d - 1)}の${pk(p).name}（〜${toHM(pk(p).end)}）と${fmtD(d)}の${pk(v).name}（${toHM(pk(v).start)}〜）が重なっています` });
        else if (gap < db.gapMin) out.push({ key: `gap|${s.id}|${d}`, sev: 'reason', cat: '勤務間隔不足', sid: s.id, d, text: `${s.name}　${fmtD(d - 1)}の${pk(p).name}から${fmtD(d)}の${pk(v).name}まで${hm(gap)}（基準${hm(db.gapMin)}・仮）` });
      }
      const w = wishOf(s.id, d);
      if (w && w.k !== v) out.push({ key: `wish|${s.id}|${d}`, sev: 'info', cat: '勤務希望の未達', sid: s.id, d, text: `${s.name}　${fmtD(d)} ${pk(w.k) ? pk(w.k).name : ''}を希望` });
    }
    let run = 0;
    for (let d = 1; d <= DAYS + 1; d++) {
      if (d <= DAYS && isWork(a[d])) { run++; continue; }
      if (run > db.runMax) out.push({ key: `run|${s.id}|${d - run}`, sev: 'reason', cat: '連続勤務', sid: s.id, d: d - run, text: `${s.name}　${fmtD(d - run)}〜${fmtD(d - 1)} ${run}日連続（基準${db.runMax}日・仮）` });
      run = 0;
    }
    if (s.contract === 'week') st.wk.forEach((m, w) => { if (m > s.weekMin) out.push({ key: `wk|${s.id}|${w}`, sev: 'reason', cat: '週契約時間の超過', sid: s.id, d: WEEKS[w][0], text: `${s.name}　${weekLabel(w)} ${hm(m)}（週契約${hm(s.weekMin)}）` }); });
    else if (st.min > s.monthMin) out.push({ key: `mon|${s.id}`, sev: 'reason', cat: '月間時間の超過', sid: s.id, text: `${s.name}　月間${hm(st.min)}（規定${hm(s.monthMin)}）` });
    if (st.n > s.nMax) out.push({ key: `nmax|${s.id}`, sev: 'reason', cat: '夜勤上限の超過', sid: s.id, text: `${s.name}　夜勤${st.n}回（上限${s.nMax}回）` });
    else if (st.n < s.nMin) out.push({ key: `nmin|${s.id}`, sev: 'reason', cat: '夜勤最低回数の未達', sid: s.id, text: `${s.name}　夜勤${st.n}回（最低${s.nMin}回）` });
    else if (st.n < s.nWish) out.push({ key: `nwish|${s.id}`, sev: 'info', cat: '夜勤希望回数の未達', sid: s.id, text: `${s.name}　夜勤${st.n}回（希望${s.nWish}回）` });
  }
  for (const p of db.pairs) {
    const A = SID(p.a), B = SID(p.b); if (!A || !B || !A.active || !B.active) continue;
    for (let d = 1; d <= DAYS; d++) {
      const v = asg[p.a][d];
      if (isWork(v) && asg[p.b][d] === v) out.push({ key: `pair|${p.a}|${p.b}|${d}`, sev: p.type === '禁止' ? 'severe' : 'info', cat: `相性「${p.type}」の同時配置`, sid: p.a, sid2: p.b, d, text: `${A.name}・${B.name}　${fmtD(d)} ${pk(v).name}` });
    }
  }
  return out;
}

function evalCand(s, d, k) {
  const a = db.asg[s.id], cur = a[d];
  const block = blockReason(db.asg, s, d, k, false);
  if (block) return { ok: false, why: block };
  const notes = [], sim = a.slice(); sim[d] = k;
  const st = staffStats(sim);
  if (isWork(cur)) notes.push(`当日の${pk(cur).name}から移動`);
  const av = availOf(s.id, d); if (av && !fits(k, av)) notes.push(`勤務可能時間（${av.from}〜${av.to}）の外`);
  if (d > 1 && isWork(a[d - 1]) && gapBetween(a[d - 1], k) < db.gapMin) notes.push(`前日の${pk(a[d - 1]).name}から間隔が短い`);
  if (isWork(a[d + 1]) && gapBetween(k, a[d + 1]) < db.gapMin) notes.push(`翌日の${pk(a[d + 1]).name}まで間隔が短い`);
  if (s.contract === 'week') { if (st.wk[weekIdx(d)] > s.weekMin) notes.push('週契約時間を超える'); }
  else if (st.min > s.monthMin) notes.push(`月間${hrs(st.min)}で超過`);
  if (crosses(k) && st.n > s.nMax) notes.push('夜勤上限を超える');
  const rl = runLen(sim, d); if (rl > db.runMax) notes.push(`${rl}日連続になる`);
  if (partners(db.asg, s, d, k, '回避').length) notes.push('相性「回避」の職員と同じ勤務');
  const w = wishOf(s.id, d); if (w && w.k === k) notes.unshift('本人の勤務希望どおり');
  if (cur === 'O') notes.push('休みを勤務に変更');
  return { ok: true, notes: notes.filter(n => n !== '本人の勤務希望どおり'), good: !!(w && w.k === k), util: st.min / target(s) };
}

    h += `<div class="detail"><h3>${fmtD(d)} ${esc(pk(k).name)}・${j}</h3><span class="pill tn ${have < need ? 'warn' : 'ok'}">必要 ${need}名 / 配置 ${have}名</span>
      <button class="link" data-act="sel" data-d="${d}" data-k="${k}" data-j="${other}" style="margin-left:10px">${other}を見る</button>${notes ? `<p class="cal-note">${esc(notes)}</p>` : ''}`;
    const cands = active().filter(s => s.job === j && db.asg[s.id][d] !== k).map(s => ({ s, e: evalCand(s, d, k) }));

    const ng = cands.filter(x => !x.e.ok);
    h += `<h4>配置候補<small>勤務条件を満たす職員</small></h4>`;
    h += ok.length ? '<ul class="cands">' + ok.map(({ s, e }) => `<li><button class="cand" data-act="assign" data-s="${s.id}" data-d="${d}" data-k="${k}">${jobDot(s)}<span><b>${esc(s.name)}</b><small>${s.job}　${s.emp}</small><span class="st ${e.notes.length ? 'w' : ''}">勤務可能${e.good ? '（本人の希望どおり）' : ''}</span><small>${e.notes.length ? esc(e.notes.join('、')) : '条件内（注意事項なし）'}</small></span><span class="go">配置する ›</span></button></li>`).join('') + '</ul>'
      : `<p class="hint">この勤務に入れる${j}がいません。必要人数を見直すか、理由を記録して確定してください。</p>`;
    if (ng.length) h += `<details class="more"><summary>配置できない職員 ${ng.length}名</summary><ul class="cands">${ng.map(({ s, e }) => `<li><div class="cand no">${jobDot(s)}<span><b>${esc(s.name)}</b><small>${s.emp}</small><span class="st">${esc(e.why)}</span></span><span></span></div></li>`).join('')}</ul></details>`;
    const placed = active().filter(s => s.job === j && db.asg[s.id][d] === k);
    h += `<h4>現在の配置</h4>` + (placed.length ? '<ul class="placed">' + placed.map(s => { const lk = !!db.lock[s.id + '|' + d]; return `<li><span class="tag">配置済</span><span class="pn">${esc(s.name)}</span><span class="pr">${s.emp}${lk ? '・固定' : ''}</span><span class="acts"><button class="btn sm ghost" data-act="lock" data-s="${s.id}" data-d="${d}" aria-pressed="${lk}">${lk ? '固定を外す' : '固定する'}</button><button class="btn sm ghost" data-act="remove" data-s="${s.id}" data-d="${d}">外す</button></span></li>`; }).join('') + '</ul>' : `<p class="hint">まだ誰も配置されていません。</p>`);
    h += '</div>';

  return h;
}
function stepbarHtml() {
  const st = db.status, curI = st === 'draft' ? 0 : st === 'confirmed' ? 1 : 2;
  const steps = [['下書き', '配置を整えて、不足の解消理由を入力します'], ['確定', '重大違反がないことを確認し、確定します'], ['公開', '職員に公開し、通知します']];
  const sev = ui.issues.filter(i => i.sev === 'severe').length;
  const miss = ui.issues.filter(i => i.sev === 'reason' && !(db.reasons[i.key] || '').trim()).length;
  let btn, note, nc = '';
  if (st === 'draft') {
    btn = `<button class="btn primary" data-act="main"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>確定前チェック</button>`;
    if (sev) { nc = 'ng'; note = `重大違反が${sev}件あるため確定できません。赤枠のセルを直してください。`; }
    else if (miss) { nc = 'w'; note = `理由の入力が必要な警告が${miss}件あります（確定前チェックで入力します）`; }
    else note = '確定できる状態です';
  } else if (st === 'confirmed') {
    btn = `<button class="btn primary" data-act="main" ${can('decide') ? '' : 'disabled'}>公開する…</button>`;
    note = can('decide') ? `第${db.version}版を確定しました。公開すると職員が閲覧できます。` : '公開はシステム管理者が行います（仮の権限設定）';
  } else { btn = `<button class="btn primary" disabled>公開済み</button>`; note = `第${db.published}版を公開中です。表を変えると修正版の下書きになります。`; }
  return `<footer class="stepbar"><div class="wrap stepbar-in"><ol class="steps">${steps.map(([t, s], i) => {
    const done = i < curI || (st === 'published' && i === 2);
    return `${i ? '<li class="arr" aria-hidden="true">⟶</li>' : ''}<li class="${done ? 'done' : i === curI ? 'cur' : ''}" ${i === curI ? 'aria-current="step"' : ''}><span class="num">${done ? '✓' : i + 1}</span><span><b>${t}</b><small>${s}</small></span></li>`;
  }).join('')}</ol><div class="foot-act"><div class="row">${btn}</div><div class="foot-note ${nc}">${note}</div></div></div></footer>`;
}

function deadlineInfo() {
  const dl = new Date(db.deadline + 'T23:59:59');
  const left = Math.ceil((dl - new Date()) / 86400000);
  const [y, m, d] = db.deadline.split('-').map(Number);
  return { passed: new Date() > dl, text: `${m}/${d}(${'日月火水木金土'[new Date(y, m - 1, d).getDay()]}) 23:59`, left };

function pickSel(d, k, j) {
  if (!k) { for (const kk of order()) for (const jj of JOBS) if (countOn(db.asg, d, kk, jj) < req(d, kk, jj)) return { d, k: kk, j: jj }; return { d, k: order()[0], j: JOBS[0] }; }
  if (j) return { d, k, j };
  const short = JOBS.find(x => countOn(db.asg, d, k, x) < req(d, k, x));
  return { d, k, j: short || JOBS.find(x => req(d, k, x) > 0) || JOBS[0] };
}

  if (kind === 'pattern') {
    const k = f.dataset.k, name = $('#pf-name').value.trim(), short = $('#pf-short').value.trim();
    const start = parseHM($('#pf-start').value); let end = parseHM($('#pf-end').value); if (end <= start) end += 1440;
    const brk = parseInt($('#pf-brk').value, 10) || 0;
    if (!name || !short) return errOut('#pf-err', '名称と略称を入力してください。');
    if (db.patterns.some(p => p.short === short && p.key !== k)) return errOut('#pf-err', 'この略称はほかの勤務で使っています。');
    if (brk >= end - start) return errOut('#pf-err', '休憩が勤務時間より長くなっています。');
    const data = { name, short, start, end, brk, color: $('#pf-color').value };
    if (k) Object.assign(pk(k), data); else { const key = nid('P'); db.patterns.push({ key, ...data }); ['weekday', 'rest'].forEach(x => { db.base[x][key] = { 看護師: 0, 介護士: 0 }; }); }
    edited(); log(`勤務パターン「${name}」を${k ? '更新' : '追加'}`); closeModal(); recompute(); render(); toast('保存しました。'); return;
  }
  if (kind === 'ex') {
    const d = +$('#ex-d').value, k = $('#ex-k').value, j = $('#ex-j').value;
    db.exceptions = db.exceptions.filter(x => !(x.d === d && x.k === k && x.job === j));
    db.exceptions.push({ id: nid('x'), d, k, job: j, count: Math.max(0, parseInt($('#ex-n').value, 10) || 0), note: $('#ex-note').value.trim() });
    edited(); log(`日付例外（${fmtD(d)} ${pk(k).name}・${j}）を登録`); recompute(); render(); toast('日付例外を登録しました。'); return;
  }
  if (kind === 'cal') {
    const d = +$('#cal-d').value, name = $('#cal-name').value.trim(); if (!name) return;
    db.calendar = db.calendar.filter(c => c.d !== d);
    db.calendar.push({ id: nid('c'), d, kind: $('#cal-kind').value, name });
    edited(); log(`カレンダーに${fmtD(d)} ${name}を登録`); recompute(); render(); toast('カレンダーに登録しました。'); return;
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#pop').hidden) closePop(true); else if (!$('#modal').hidden) closeModal();
});
window.addEventListener('resize', () => closePop(false));
$('#role-sel').addEventListener('change', e => {
  ui.role = e.target.value; ui.picked = [];
  if (!allowedRoutes().includes(ui.route)) { location.hash = 'shift'; }
  if (ui.role === 'staff' && ui.reqTab === 'change' && !db.pubAsg) ui.reqTab = 'wish';
  render(); toast(`「${e.target.selectedOptions[0].textContent}」の立場で表示しています。`);
});
function route() {
  const h = location.hash.slice(1);
  ui.route = allowedRoutes().includes(h) ? h : 'shift';
  closeModal(); $('#modal').hidden = true; render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ---------- 起動 ---------- */
const saved = load();
if (saved) { db = saved; recompute(); ui.sel = defaultSel(); }
else resetAll();
route();
})();
</script>

</body>
